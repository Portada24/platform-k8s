# Application raíz (App of Apps). Cada source apunta a un directorio con Applications hijas.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  sources:
    - repoURL: https://github.com/CHANGE_ME/platform-k8s.git
      targetRevision: main
      path: infra
    - repoURL: https://github.com/CHANGE_ME/platform-k8s.git
      targetRevision: main
      path: observability
    - repoURL: https://github.com/CHANGE_ME/platform-k8s.git
      targetRevision: main
      path: apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

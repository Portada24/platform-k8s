# Calico vía Tigera operator. El CIDR debe coincidir con cluster-cidr de k3s.
apiVersion: operator.tigera.io/v1
kind: Installation
metadata:
  name: default
spec:
  calicoNetwork:
    containerIPForwarding: Enabled   # requerido en k3s
    ipPools:
      - name: default-ipv4-ippool
        cidr: 10.42.0.0/16
        encapsulation: VXLAN
        natOutgoing: Enabled
        nodeSelector: all()
